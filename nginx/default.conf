server {
    listen 80;
    server_name localhost;
    root   /usr/share/nginx/html; 
    index  index.html index.htm;
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://54.180.155.24:8070/;
        proxy_http_version 1.1; 
    }
    location /images/ {
        proxy_pass http://54.180.155.24:8070/images/;
        proxy_http_version 1.1;
    }
}